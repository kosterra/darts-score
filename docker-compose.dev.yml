services:

  # ---------------------------------------------------------------------------
  # MongoDB
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    env_file:
      - ./mongo.env
    environment:
      # mongod < 8.0.35 refuses to start on Ubuntu 7.0.0-x kernels (SERVER-131779).
      # Letting glibc own rseq makes TCMalloc skip per-CPU caches, which passes the check.
      # Remove once mongo:8.0 resolves to >= 8.0.35.
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    volumes:
      - darts_score_db:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # API — nodemon restarts on any source change
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      target: development
    ports:
      - "3001:3001"
    volumes:
      - ./app-api:/app
      - /app/node_modules
      - ./data:/app/data
    env_file:
      - ./.env
    environment:
      NODE_ENV: development
      # .env targets the production container name; here the service is just "mongo"
      DB_HOST: mongo
      # Mails (password reset, club admin invitations) go to the local Mailpit inbox
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      APP_URL: http://localhost:3000
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Mailpit — catches every mail the API sends; inbox at http://localhost:8025
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"

  # ---------------------------------------------------------------------------
  # UI — Vite HMR, proxies /api to the api service
  # ---------------------------------------------------------------------------
  ui:
    build:
      context: .
      target: ui-development
    ports:
      - "3000:3000"
    volumes:
      - ./app-ui:/ui
      - /ui/node_modules
      # the app version shown on the About page, read from the root package.json.
      # The folder is mounted (read-only), not the single file: a single-file mount
      # keeps showing the old file once git replaces it, e.g. when switching branches
      - .:/repo:ro
    environment:
      API_PROXY_TARGET: http://api:3001
      ROOT_PACKAGE: /repo/package.json
    restart: unless-stopped
    depends_on:
      - api

volumes:
  darts_score_db:
    name: darts_score_db
