          schema:
            type: integer
            default: 5
            maximum: 50
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The games
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
