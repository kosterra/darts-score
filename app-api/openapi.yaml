  /api/clubs/{id}/game-rules:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags:
        - Clubs
      summary: Save the club's own rules for its games (club admins)
      description: >-
        Per game (x01, cricket, elimination, clock, shanghai, killer, halveit, golf, tactics) whether the club plays it, its defaults,
        the choices it offers and the settings it locks, including the house rules (X01 legStarter, roundLimit and bull; Cricket
        roundLimit; Shanghai instantWin; Killer become and ownDouble; Halve-It targets). Also the club's own formats (at most 20,
        each { id, game, name, settings, friendly }), builtInFormats, friendlyChoice (players may mark a game as friendly),
        handicap { mode off|offered|suggested, maxDifference }, waysOut and halveItTargets. Whatever does not fit is left out. A new
        game against a locked rule, a choice not offered or the handicap policy is refused with 422; a running game keeps its
        settings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                games:
                  type: object
                formats:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                builtInFormats:
                  type: boolean
                friendlyChoice:
                  type: boolean
                handicap:
                  type: object
                waysOut:
                  type: boolean
                halveItTargets:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: The club with its game rules
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Validation error
      operationId: putClubsByidGameRules
  /api/clubs/{id}/goals:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags:
        - Clubs
      summary: Save the club's goals (club admins)
      description: >-
        Up to three goals, each a metric (games, num180s, darts, tonPlus, highFinishes, trainings), a target and an optional end
        date. A goal sent back with its id and the same metric and target keeps when it started and whether it was reached; a new or
        changed one starts now. What counts is what the club played between the start and the end. When a goal is reached its
        members get a notification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - goals
              properties:
                goals:
                  type: array
                  maxItems: 3
                  items:
                    type: object
                    required:
                      - metric
                      - target
                    properties:
                      id:
                        type: string
                      metric:
                        type: string
                        enum: [games, num180s, darts, tonPlus, highFinishes, trainings]
                      target:
                        type: integer
                        minimum: 1
                        maximum: 10000000
                      until:
                        type: [string, 'null']
                        format: date-time
      responses:
        '200':
          description: The goals, each with its title, description, from, until, reachedAt and progress
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Validation error
      operationId: putClubsByidGoals
