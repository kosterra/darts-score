openapi: 3.1.0
info:
  title: Legmate API
  description: >-
    REST API for Legmate, the darts club app: accounts, clubs, players, games (X01, Cricket, Elimination, Around the Clock, and Shanghai,
    Killer, Halve-It, Golf and Tactics on the rules engine), trainings (Around the Clock, X01 against the bot, Bob's 27, 121 Checkout,
    Random checkouts, Scoring, Doubles around the board and Catch 40), statistics and the overviews of the club's games, trainings and
    badges, badges and levels, flights to collect, fair play, deletion requests, notifications, quick games without an account, and the
    administration of the whole installation.


    **Authentication:** log in with `POST /api/auth/login`; the response sets a signed, HTTP-only session cookie that authenticates all
    further requests. A login lasts a set time (5 hours unless a global admin sets 1 to 24); `POST /api/auth/session/extend` starts it
    again. Without a valid login the API answers 401.


    **Clubs:** players, games, trainings and statistics belong to a club. Requests under `/api/players`, `/api/games`, `/api/training` and
    `/api/stats` name the club in an `X-Club-Id` header. The user must be an admin of that club or have a login for one of its players.
    Players read, play games and record trainings, ask to delete games, and look after their own player (nickname, picture, preferences,
    flights); managing players and deleting games is for club admins.


    **Global admins** look after the installation (`/api/admin`, `/api/users`) and belong to no club.
  version: 2026.10.17
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: http://localhost:3001
    description: Local development
security:
  - sessionCookie: []
tags:
  - name: Public
    description: What visitors see without a login
  - name: Auth
    description: Registration, login, the session and the logged-in user
  - name: Clubs
    description: Clubs of the logged-in user (all clubs for a global admin)
  - name: Joining clubs
    description: Users find clubs that take new members, join or ask to join; the club admins accept or decline
  - name: Users
    description: Accounts (global admins only)
  - name: Quick games
    description: Games on the public start page without an account, kept for 30 days
  - name: Tournaments
    description: The knockout tournaments of a club, from the registration to the final
  - name: Administration
    description: 'The installation: all clubs, players, games, trainings, banner, login length, error log, alerts and blocks (global admins only)'
  - name: Players
    description: The players of a club
  - name: Flights
    description: Flight points, and the flight shapes, designs and barrels a player collects
  - name: Player Images
    description: Player pictures and club logos
  - name: X01
    description: X01 games
  - name: Cricket
    description: Cricket games
  - name: Elimination
    description: Elimination games
  - name: Around the Clock
    description: Around the Clock games
  - name: More games
    description: Shanghai, Killer, Halve-It, Golf and Tactics, played by the rules engine of the app
  - name: More trainings
    description: Bob's 27, 121 Checkout, Random checkouts, Scoring, Doubles around the board and Catch 40
  - name: ATC
    description: Around the Clock trainings
  - name: X01 training
    description: X01 trainings against the bot
  - name: Deletion requests
    description: Players ask to delete a game they played; the others agree, the club admins decide
  - name: Statistics
    description: Statistics of players, games and the club
  - name: Badges
    description: Badges, the Hall of Shame, levels and the flight catalogue
  - name: Fair play
    description: Games and trainings that cannot be real, wrong data or worth a look (club admins; global admins for every club)
  - name: Notifications
    description: The logged-in user's notifications
paths:
  /api/health:
    get:
      tags:
        - Auth
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: The server is running
      operationId: getHealth
  /api/unsubscribe:
    get:
      tags:
        - Notifications
      summary: What an unsubscribe link of a mail is for
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: For an account or a player without a login, and the topic ('all' for every mail)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unsubscribed'
        '404':
          description: Not a valid link
      operationId: getUnsubscribe
    post:
      tags:
        - Notifications
      summary: Get no more of the mails of an unsubscribe link
      description: Also the one-click unsubscribing of mail programs (List-Unsubscribe-Post).
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Turned off
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unsubscribed'
        '404':
          description: Not a valid link
      operationId: postUnsubscribe
  /api/claim/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - Players
      summary: Who a claim link is for
      description: A claim link lets a player without a login take over their player with an account of their own.
      security: []
      responses:
        '200':
          description: The player and the club
          content:
            application/json:
              schema:
                type: object
                properties:
                  nickname:
                    type: string
                  firstname:
                    type: string
                  club:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      logo:
                        type: string
        '404':
          description: Unknown or expired, or the player has a login already
      operationId: getClaimBytoken
    post:
      tags:
        - Players
      summary: Take over the player of a claim link with the logged-in account
      responses:
        '200':
          description: The account plays as the player from now on
          content:
            application/json:
              schema:
                type: object
                properties:
                  club:
                    type: string
                  player:
                    type: string
                  nickname:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown or expired, or the player has a login already
        '409':
          description: The account already plays as someone else in a club of the player
      operationId: postClaimBytoken
  /api/public/site:
    get:
      tags:
        - Public
      summary: Whether the installation shows its start page to everyone
      description: false when the global admins chose to open with the login instead (System settings → Start page).
      security: []
      operationId: getPublicSite
      responses:
        '200':
          description: The setting
          content:
            application/json:
              schema:
                type: object
                properties:
                  publicSite:
                    type: boolean
  /api/public/contact:
    post:
      tags:
        - Public
      summary: Send a message of the contact form
      description: The message goes by mail to the operator of the installation (System settings → Privacy and imprint), with the sender as the address to reply to; Legmate stores nothing of it. At most 5 messages an hour from one network. A filled website field (left empty by people) drops the message quietly.
      security: []
      operationId: postPublicContact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - message
              properties:
                name:
                  type: string
                  maxLength: 80
                email:
                  type: string
                  format: email
                message:
                  type: string
                  minLength: 10
                  maxLength: 3000
                website:
                  type: string
                  description: Left empty; filled only by bots
      responses:
        '200':
          description: Sent
        '404':
          description: This installation has no contact form
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Too many messages from this network
        '424':
          description: The mail server did not take the message
  /api/public/support:
    get:
      tags:
        - Public
      summary: The ways to support Legmate with a gift, for the page /support
      responses:
        '200':
          description: '{ url: a donation page of this installation, twint: its TWINT link, project: the sponsoring page of the project (empty when url is the same) }'
      operationId: getPublicSupport
  /api/public/legal:
    get:
      tags:
        - Public
      summary: What the privacy policy and imprint show
      description: Who runs the installation (as its global admins entered it), whether it sends mails, and how long what is kept on it.
      security: []
      responses:
        '200':
          description: The details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/LegalSettings'
                  - type: object
                    properties:
                      mailEnabled:
                        type: boolean
                      contactForm:
                        type: boolean
                        description: Whether the contact form can send (the operator's address and a mail server are set)
                      keep:
                        type: object
                        additionalProperties:
                          type: integer
      operationId: getPublicLegal
  /api/auth/register:
    post:
      tags:
        - Auth
      summary: Register an account and log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: Account created; session cookie set
        '409':
          description: Email already registered
        '422':
          description: Validation failed
      operationId: postAuthRegister
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Log in
      description: 'With two-step login on (or required and not set up after its days), the session does not start yet: the answer is { mfaRequired: true, step: "code" | "enroll" } with a signed cookie for the next step (see /api/auth/login/mfa and /api/auth/mfa/setup). Registering and choosing a new password with a link answer the same way.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Logged in; session cookie set
        '401':
          description: Email or password is wrong
      operationId: postAuthLogin
  /api/auth/login/mfa:
    post:
      tags:
        - Auth
      summary: The second step of logging in
      description: After a login answered mfaRequired with the step "code" (a signed cookie for 5 minutes). A code of the authenticator app, or one of the recovery codes (each works once). trust skips the code on this device for 30 days. Five wrong codes make the account wait a few minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: Six digits of the authenticator app
                recoveryCode:
                  type: string
                trust:
                  type: boolean
      responses:
        '200':
          description: Logged in; the account, with its two-step login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Wrong code, or the login took too long
        '429':
          description: Too many wrong codes
      operationId: postAuthLoginMfa
  /api/auth/mfa:
    get:
      tags:
        - Auth
      summary: The two-step login of the account
      responses:
        '200':
          description: Its state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaState'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: getAuthMfa
  /api/auth/mfa/setup:
    post:
      tags:
        - Auth
      summary: Start setting up two-step login
      description: A new secret for the authenticator app, as its key and the otpauth address for a QR code. Logged in, or while logging in when it is required (the step "enroll").
      security: []
      responses:
        '200':
          description: The secret
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
                  uri:
                    type: string
        '401':
          description: Not logged in, and no login waiting to set it up
        '409':
          description: It is on already
      operationId: postAuthMfaSetup
  /api/auth/mfa/enable:
    post:
      tags:
        - Auth
      summary: Turn on two-step login with the first code of the app
      description: Answers the ten recovery codes, shown only now. While logging in, the session starts too.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: Six digits of the authenticator app
                trust:
                  type: boolean
      responses:
        '200':
          description: On, with the recovery codes
          content:
            application/json:
              schema:
                type: object
                properties:
                  recoveryCodes:
                    type: array
                    items:
                      type: string
                  mfa:
                    $ref: '#/components/schemas/MfaState'
        '401':
          description: Not logged in, and no login waiting to set it up
        '409':
          description: It is on already, or setting it up has to start again
        '422':
          description: Wrong code
      operationId: postAuthMfaEnable
  /api/auth/mfa/disable:
    post:
      tags:
        - Auth
      summary: Turn off two-step login
      description: With the password and a current code; not while it is required for the account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: Six digits of the authenticator app
                password:
                  type: string
      responses:
        '200':
          description: Off
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Wrong password or code
        '409':
          description: Off already, or required
      operationId: postAuthMfaDisable
  /api/auth/mfa/recovery-codes:
    post:
      tags:
        - Auth
      summary: New recovery codes
      description: With a current code; the old ones stop working.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: Six digits of the authenticator app
      responses:
        '200':
          description: The new codes
          content:
            application/json:
              schema:
                type: object
                properties:
                  recoveryCodes:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Wrong code
      operationId: postAuthMfaRecoveryCodes
  /api/auth/mfa/forget-devices:
    post:
      tags:
        - Auth
      summary: Every trusted device asks for the code again
      responses:
        '200':
          description: Done
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: postAuthMfaForgetDevices
  /api/auth/delete-account:
    get:
      tags:
        - Auth
      summary: What stands before deleting the own account
      description: Whether the account is the only global admin (then it cannot go), and the clubs it is the only admin of, each with how many members it has and the members with a login who could take it over.
      responses:
        '200':
          description: The steps
          content:
            application/json:
              schema:
                type: object
                properties:
                  globalAdmin:
                    type: [string, 'null']
                    description: Why the only global admin cannot go
                  clubs:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        members:
                          type: integer
                        candidates:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              name:
                                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: getAuthDeleteAccount
    post:
      tags:
        - Auth
      summary: Delete the own account
      description: With the password, and a code of the authenticator app when two-step login is on. The account goes with its settings, notifications and login; its players stay in their clubs, anonymised (an anonymous nickname, no name, picture, date of birth or country, as guests), so the games and statistics of the others stay whole. Each club the account is the only admin of is handed over to one of its members with a login (who is told so) or deleted with everything in it, confirmed with its name; all steps are checked before anything changes. Refused for the only global admin. A last mail confirms it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                code:
                  type: string
                clubs:
                  type: array
                  description: One step for each club the account is the only admin of
                  items:
                    type: object
                    required:
                      - club
                      - action
                    properties:
                      club:
                        type: string
                      action:
                        type: string
                        enum: [handover, delete]
                      to:
                        type: string
                        description: The account that takes the club over (handover)
                      name:
                        type: string
                        description: The name of the club, typed to delete it (delete)
      responses:
        '200':
          description: Deleted; the session ends
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Wrong password or code
        '409':
          description: A club of the only admin without a step that does, or the only global admin
      operationId: postAuthDeleteAccount
  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: Log out
      security: []
      responses:
        '200':
          description: Session cookie cleared
      operationId: postAuthLogout
  /api/auth/config:
    get:
      tags:
        - Auth
      summary: Whether the server can send mails (password reset, invitations)
      security: []
      responses:
        '200':
          description: OK
      operationId: getAuthConfig
  /api/auth/forgot-password:
    post:
      tags:
        - Auth
      summary: Mail a password reset link
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailInput'
      responses:
        '200':
          description: Always the same answer, whether or not the account exists
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: Email sending is not set up
      operationId: postAuthForgotPassword
  /api/auth/reset-password:
    post:
      tags:
        - Auth
      summary: Set a new password with the token from a reset or invitation mail and log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetInput'
      responses:
        '200':
          description: Password set; session cookie set
        '400':
          description: Link invalid or expired
      operationId: postAuthResetPassword
  /api/auth/me:
    get:
      tags:
        - Auth
      summary: The logged-in user
      responses:
        '200':
          description: OK
        '401':
          description: Not logged in
      operationId: getAuthMe
    put:
      tags:
        - Auth
      summary: Update own name and email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileInput'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Email already registered
      operationId: putAuthMe
  /api/auth/game-preferences:
    put:
      tags:
        - Auth
      summary: Save how the player likes to play, on every device
      description: >-
        Merged into what the account had: waysOut (all, turn, off), autoSend (the visit is sent after the third dart),
        leftHanded (the keypad for the left hand), celebrations (full or quiet), inputMode (board or keypad), dateFormat
        (DD.MM.YYYY, DD/MM/YYYY, MM/DD/YYYY, YYYY-MM-DD, or null for the language's usual one), favourites
        (per game up to three formats pinned first), setups (per club and game the last setup { settings, friendly,
        playerIds, savedAt }, merged per club) and training ({ bot, atcMode, atcScoring }). Whatever does not fit is left out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: The account with its gamePreferences
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Validation error
      operationId: putAuthGamePreferences
  /api/auth/onboarding:
    put:
      tags:
        - Auth
      summary: The welcome tour and the first steps of a new account
      description: tour done (finished or skipped) or again (shown at the next start); first steps on the Dashboard hidden or shown again. Either or both.
      operationId: putAuthOnboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tour:
                  type: string
                  enum: [done, again]
                firstSteps:
                  type: string
                  enum: [hidden, shown]
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/auth/language:
    put:
      tags:
        - Auth
      summary: Save the language of the app on the account
      description: The app, the mails and the messages of the API then use it for the user.
      operationId: putAuthLanguage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - language
              properties:
                language:
                  $ref: '#/components/schemas/Language'
      responses:
        '200':
          description: The user, with the language
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/auth/session:
    get:
      tags:
        - Auth
      summary: When the login ends
      responses:
        '200':
          description: The end of the login and its length
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: getAuthSession
  /api/auth/players:
    get:
      tags:
        - Auth
      summary: The user's own players
      description: Every player the user plays as, with their clubs, preferences and whether they may correct their date of birth.
      responses:
        '200':
          description: The players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyPlayer'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: getAuthPlayers
  /api/auth/session/extend:
    post:
      tags:
        - Auth
      summary: Stay logged in
      description: Starts the login again for the full length (e.g. from the countdown before it ends).
      responses:
        '200':
          description: The new end
          content:
            application/json:
              schema:
                type: object
                properties:
                  expiresAt:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: postAuthSessionExtend
  /api/auth/password:
    put:
      tags:
        - Auth
      summary: Change own password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordInput'
      responses:
        '200':
          description: Password changed; other sessions are logged out
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Current password is wrong
      operationId: putAuthPassword
  /api/public/overview:
    get:
      tags:
        - Public
      summary: Data of the public start page - totals, public clubs, their running games and latest results
      description: Needs no login. Only public clubs appear, and players are named only when their nickname is set to public. Each club comes with its figures (players, games played in all and in the last 30 days, the last game, the busiest weekday, the X01 average and the 180s); the totals count the games of the last 7 days too, and are null while the global admins keep the numbers off the start page (System settings).
      security: []
      responses:
        '200':
          description: OK
      operationId: getPublicOverview
  /api/public/evenings:
    post:
      tags:
        - Quick games
      summary: 'Start a darts evening without an account: 2 to 8 players by name; the key comes back once'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - names
              properties:
                name:
                  type: string
                  maxLength: 60
                names:
                  type: array
                  minItems: 2
                  maxItems: 8
                  items:
                    type: string
      responses:
        '201':
          description: '{ evening, key }'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Too many evenings from one network
      operationId: postPublicEvenings
  /api/public/evenings/{id}:
    get:
      tags:
        - Quick games
      summary: An evening with its games and report, for the browser with its key (X-Quick-Key)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{ id, name, players: [{ id, name }], games: [{ id, kind, players, winner, finished, running, setup, createdAt }], report: { table, awards, headToHead, form, played, running }, createdAt, club, shareToken (only with the key) }'
        '404':
