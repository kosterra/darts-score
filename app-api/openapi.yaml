openapi: 3.1.0
info:
  title: Oche API
  description: >-
    REST API for Oche, the darts club app: accounts, clubs, players, games (X01, Cricket, Elimination, Around the Clock, and Shanghai,
    Killer, Halve-It, Golf and Tactics on the rules engine), trainings (Around the Clock, X01 against the bot, Bob's 27, 121 Checkout,
    Random checkouts, Scoring, Doubles around the board and Catch 40), statistics and the overviews of the club's games, trainings and
    badges, badges and levels, flights to collect, fair play, deletion requests, notifications, quick games without an account, and the
    administration of the whole installation.


    **Authentication:** log in with `POST /api/auth/login`; the response sets a signed, HTTP-only session cookie that authenticates all
    further requests. A login lasts a set time (5 hours unless a global admin sets 1 to 24); `POST /api/auth/session/extend` starts it
    again. Without a valid login the API answers 401.


    **Clubs:** players, games, trainings and statistics belong to a club. Requests under `/api/players`, `/api/games`, `/api/training` and
    `/api/stats` name the club in an `X-Club-Id` header. The user must be an admin of that club or have a login for one of its players.
    Players read, play games and record trainings, ask to delete games, and look after their own player (nickname, picture, preferences,
    flights); managing players and deleting games is for club admins.


    **Global admins** look after the installation (`/api/admin`, `/api/users`) and belong to no club.
  version: 2026.10.14
  license:
    name: GPLv3
    url: https://www.gnu.org/licenses/gpl-3.0.html
servers:
  - url: http://localhost:3001
    description: Local development
security:
  - sessionCookie: []
tags:
  - name: Public
    description: What visitors see without a login
  - name: Auth
    description: Registration, login, the session and the logged-in user
  - name: Clubs
    description: Clubs of the logged-in user (all clubs for a global admin)
  - name: Joining clubs
    description: Users find clubs that take new members, join or ask to join; the club admins accept or decline
  - name: Users
    description: Accounts (global admins only)
  - name: Quick games
    description: Games on the public start page without an account, kept for 30 days
  - name: Administration
    description: 'The installation: all clubs, players, games, trainings, banner, login length, error log, alerts and blocks (global admins only)'
  - name: Players
    description: The players of a club
  - name: Flights
    description: Flight points, and the flight shapes, designs and barrels a player collects
  - name: Player Images
    description: Player pictures and club logos
  - name: X01
    description: X01 games
  - name: Cricket
    description: Cricket games
  - name: Elimination
    description: Elimination games
  - name: Around the Clock
    description: Around the Clock games
  - name: More games
    description: Shanghai, Killer, Halve-It, Golf and Tactics, played by the rules engine of the app
  - name: More trainings
    description: Bob's 27, 121 Checkout, Random checkouts, Scoring, Doubles around the board and Catch 40
  - name: ATC
    description: Around the Clock trainings
  - name: X01 training
    description: X01 trainings against the bot
  - name: Deletion requests
    description: Players ask to delete a game they played; the others agree, the club admins decide
  - name: Statistics
    description: Statistics of players, games and the club
  - name: Badges
    description: Badges, the Hall of Shame, levels and the flight catalogue
  - name: Fair play
    description: Games and trainings that cannot be real, wrong data or worth a look (club admins; global admins for every club)
  - name: Notifications
    description: The logged-in user's notifications
paths:
  /api/health:
    get:
      tags:
        - Auth
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: The server is running
      operationId: getHealth
  /api/unsubscribe:
    get:
      tags:
        - Notifications
      summary: What an unsubscribe link of a mail is for
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: For an account or a player without a login, and the topic ('all' for every mail)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unsubscribed'
        '404':
          description: Not a valid link
      operationId: getUnsubscribe
    post:
      tags:
        - Notifications
      summary: Get no more of the mails of an unsubscribe link
      description: Also the one-click unsubscribing of mail programs (List-Unsubscribe-Post).
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Turned off
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unsubscribed'
        '404':
          description: Not a valid link
      operationId: postUnsubscribe
  /api/claim/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - Players
      summary: Who a claim link is for
      description: A claim link lets a player without a login take over their player with an account of their own.
      security: []
      responses:
        '200':
          description: The player and the club
          content:
            application/json:
              schema:
                type: object
                properties:
                  nickname:
                    type: string
                  firstname:
                    type: string
                  club:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      logo:
                        type: string
        '404':
          description: Unknown or expired, or the player has a login already
      operationId: getClaimBytoken
    post:
      tags:
        - Players
      summary: Take over the player of a claim link with the logged-in account
      responses:
        '200':
          description: The account plays as the player from now on
          content:
            application/json:
              schema:
                type: object
                properties:
                  club:
                    type: string
                  player:
                    type: string
                  nickname:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown or expired, or the player has a login already
        '409':
          description: The account already plays as someone else in a club of the player
      operationId: postClaimBytoken
  /api/auth/register:
    post:
      tags:
        - Auth
      summary: Register an account and log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: Account created; session cookie set
        '409':
          description: Email already registered
        '422':
          description: Validation failed
      operationId: postAuthRegister
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Logged in; session cookie set
        '401':
          description: Email or password is wrong
      operationId: postAuthLogin
  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: Log out
      security: []
      responses:
        '200':
          description: Session cookie cleared
      operationId: postAuthLogout
  /api/auth/config:
    get:
      tags:
        - Auth
      summary: Whether the server can send mails (password reset, invitations)
      security: []
      responses:
        '200':
          description: OK
      operationId: getAuthConfig
  /api/auth/forgot-password:
    post:
      tags:
        - Auth
      summary: Mail a password reset link
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailInput'
      responses:
        '200':
          description: Always the same answer, whether or not the account exists
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: Email sending is not set up
      operationId: postAuthForgotPassword
  /api/auth/reset-password:
    post:
      tags:
        - Auth
      summary: Set a new password with the token from a reset or invitation mail and log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetInput'
      responses:
        '200':
          description: Password set; session cookie set
        '400':
          description: Link invalid or expired
      operationId: postAuthResetPassword
  /api/auth/me:
    get:
      tags:
        - Auth
      summary: The logged-in user
      responses:
        '200':
          description: OK
        '401':
          description: Not logged in
      operationId: getAuthMe
    put:
      tags:
        - Auth
      summary: Update own name and email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileInput'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Email already registered
      operationId: putAuthMe
  /api/auth/game-preferences:
    put:
      tags:
        - Auth
      summary: Save how the player likes to play, on every device
      description: >-
        Merged into what the account had: waysOut (all, turn, off), autoSend (the visit is sent after the third dart),
        leftHanded (the keypad for the left hand), celebrations (full or quiet), inputMode (board or keypad), dateFormat
        (DD.MM.YYYY, DD/MM/YYYY, MM/DD/YYYY, YYYY-MM-DD, or null for the language's usual one), favourites
        (per game up to three formats pinned first), setups (per club and game the last setup { settings, friendly,
        playerIds, savedAt }, merged per club) and training ({ bot, atcMode, atcScoring }). Whatever does not fit is left out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: The account with its gamePreferences
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Validation error
      operationId: putAuthGamePreferences
  /api/auth/language:
    put:
      tags:
        - Auth
      summary: Save the language of the app on the account
      description: The app, the mails and the messages of the API then use it for the user.
      operationId: putAuthLanguage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - language
              properties:
                language:
                  $ref: '#/components/schemas/Language'
      responses:
        '200':
          description: The user, with the language
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/auth/dashboard/{clubId}:
    put:
      tags:
        - Auth
      summary: Arrange the user's own dashboard in a club
      description: The user's own arrangement of the dashboard in one of their clubs; with layout null they see the club's again.
      operationId: putAuthDashboardByclubId
      parameters:
        - name: clubId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - layout
              properties:
                layout:
                  oneOf:
                    - $ref: '#/components/schemas/DashboardLayout'
                    - type: 'null'
      responses:
        '200':
          description: The user, with their dashboards
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/auth/session:
    get:
      tags:
        - Auth
      summary: When the login ends
      responses:
        '200':
          description: The end of the login and its length
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: getAuthSession
  /api/auth/players:
    get:
      tags:
        - Auth
      summary: The user's own players
      description: Every player the user plays as, with their clubs, preferences and whether they may correct their date of birth.
      responses:
        '200':
          description: The players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyPlayer'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: getAuthPlayers
  /api/auth/session/extend:
    post:
      tags:
        - Auth
      summary: Stay logged in
      description: Starts the login again for the full length (e.g. from the countdown before it ends).
      responses:
        '200':
          description: The new end
          content:
            application/json:
              schema:
                type: object
                properties:
                  expiresAt:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: postAuthSessionExtend
  /api/auth/password:
    put:
      tags:
        - Auth
      summary: Change own password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordInput'
      responses:
        '200':
          description: Password changed; other sessions are logged out
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Current password is wrong
      operationId: putAuthPassword
  /api/public/overview:
    get:
      tags:
        - Public
      summary: Data of the public start page - totals, public clubs, their running games and latest results
      description: Needs no login. Only public clubs appear, and players are named only when their nickname is set to public. Each club comes with its figures (players, games played in all and in the last 30 days, the last game, the busiest weekday, the X01 average and the 180s); the totals count the games of the last 7 days too, and are null while the global admins keep the numbers off the start page (System settings).
      security: []
      responses:
        '200':
          description: OK
      operationId: getPublicOverview
  /api/public/quick-games:
    post:
      tags:
        - Quick games
      summary: Start a quick game without an account (X01 or Cricket, 1 to 4 players by name)
      description: 'No login. At most 10 new games per hour from one network. The key in the answer comes only once: the browser keeps it and sends it as X-Quick-Key to play on. Quick games are kept 30 days and never count for clubs, players or the public figures.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - kind
                - game
              properties:
                kind:
                  type: string
                  enum:
                    - x01
                    - cricket
                game:
                  type: object
                  description: 'The game as the game page keeps it, with players ["q1", …] and quickPlayers [{ id, nickname }]. X01: 301 or 501, Straight In, Double or Straight Out, best of 1, 3 or 5 legs; Cricket: Standard or Cut-throat; flyingDarts "off".'
      responses:
        '201':
          description: The game and its key
          content:
            application/json:
              schema:
                type: object
                properties:
                  game:
                    type: object
                  key:
                    type: string
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Too many quick games from this network
      operationId: postPublicQuickGames
  /api/public/quick-games/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: X-Quick-Key
        in: header
        required: true
        description: The key the game was started with
        schema:
          type: string
    get:
      tags:
        - Quick games
      summary: A quick game, for the browser that started it
      security: []
      responses:
        '200':
          description: The game
        '404':
          description: Not found, or not with this key
      operationId: getPublicQuickGamesByid
    put:
      tags:
        - Quick games
      summary: Save a quick game after a visit or an undo; its setup and players stay as they were
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: The game
        '404':
          description: Not found, or not with this key
        '422':
          $ref: '#/components/responses/ValidationError'
      operationId: putPublicQuickGamesByid
  /api/public/quick-games/{id}/stats:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: X-Quick-Key
        in: header
        required: true
        description: The key the game was started with
        schema:
          type: string
    get:
      tags:
        - Quick games
      summary: The statistics of a quick X01 game (averages per leg, doubles, score ranges, sections hit)
      security: []
      responses:
        '200':
          description: The statistics
        '404':
          description: Not found, not with this key, or no X01 game
      operationId: getPublicQuickGamesByidStats
  /api/public/banner:
    get:
      tags:
        - Public
      summary: The banner shown on top of every page while it is switched on ({ enabled, text, color })
      security: []
      responses:
        '200':
          description: OK
      operationId: getPublicBanner
  /api/clubs:
    get:
      tags:
        - Clubs
      summary: Clubs the user is an admin or a player of, with that role (global admins find every club under /api/admin/overview)
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: getClubs
    post:
      tags:
        - Clubs
      summary: Create a club with the logged-in user as its admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClubInput'
      responses:
        '201':
          description: Club created
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: postClubs
  /api/clubs/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags:
        - Clubs
      summary: Change a club's name and public visibility settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClubInput'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: No access to this club
      operationId: putClubsByid
    delete:
      tags:
        - Clubs
      summary: Delete a club and its games (a global admin also deletes its players)
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The club still has players (only for club admins)
      operationId: deleteClubsByid
  /api/clubs/{id}/game-rules:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags:
        - Clubs
      summary: Save the club's own rules for its games (club admins)
      description: >-
        Per game (x01, cricket, elimination, clock, shanghai, killer, halveit, golf, tactics) whether the club plays it, its defaults,
        the choices it offers and the settings it locks, including the house rules (X01 legStarter, roundLimit and bull; Cricket
        roundLimit; Shanghai instantWin; Killer become and ownDouble; Halve-It targets). Also the club's own formats (at most 20,
        each { id, game, name, settings, friendly }), builtInFormats, friendlyChoice (players may mark a game as friendly),
        handicap { mode off|offered|suggested, maxDifference }, waysOut and halveItTargets. Whatever does not fit is left out. A new
        game against a locked rule, a choice not offered or the handicap policy is refused with 422; a running game keeps its
        settings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                games:
                  type: object
                formats:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                builtInFormats:
                  type: boolean
                friendlyChoice:
                  type: boolean
                handicap:
                  type: object
                waysOut:
                  type: boolean
                halveItTargets:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: The club with its game rules
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Validation error
      operationId: putClubsByidGameRules
  /api/clubs/{id}/goals:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags:
        - Clubs
      summary: Save the club's goals (club admins)
      description: >-
        Up to three goals, each a metric (games, num180s, darts, tonPlus, highFinishes, trainings), a target and an optional end
        date. A goal sent back with its id and the same metric and target keeps when it started and whether it was reached; a new or
        changed one starts now. What counts is what the club played between the start and the end. When a goal is reached its
        members get a notification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - goals
              properties:
                goals:
                  type: array
                  maxItems: 3
                  items:
                    type: object
                    required:
                      - metric
                      - target
                    properties:
                      id:
                        type: string
                      metric:
                        type: string
                        enum: [games, num180s, darts, tonPlus, highFinishes, trainings]
                      target:
                        type: integer
                        minimum: 1
                        maximum: 10000000
                      until:
                        type: [string, 'null']
                        format: date-time
      responses:
        '200':
          description: The goals, each with its title, description, from, until, reachedAt and progress
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Validation error
      operationId: putClubsByidGoals
  /api/clubs/{id}/logo:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags:
        - Clubs
      summary: Upload a new logo for the club (multipart field "logo", .png or .jpg)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                logo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Logo saved
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: No valid image
      operationId: putClubsByidLogo
    delete:
      tags:
        - Clubs
      summary: Remove the club's logo
      responses:
        '200':
          description: Logo removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      operationId: deleteClubsByidLogo
  /api/clubs/{id}/admins:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags:
        - Clubs
      summary: Add an admin; creates the account when the email is unknown
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClubAdminInput'
      responses:
        '201':
          description: Admin added
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Already an admin of the club
        '422':
          description: Names or initial password missing for a new account
      operationId: postClubsByidAdmins
  /api/clubs/{id}/admins/{userId}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: userId
        in: path
        required: true
        schema:
          type: string
    delete:
      tags:
        - Clubs
      summary: Remove an admin from the club
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A club needs at least one admin
      operationId: deleteClubsByidAdminsByuserId
  /api/clubs/directory:
    get:
      tags:
        - Joining clubs
      summary: The clubs that take new members, with whether the user is in one already or asked to join
      description: Clubs whose joinPolicy is open or approval. "nickname" is the one of the user's player in another club, which joining takes along; null when the user still has to choose one.
      parameters:
        - name: q
          in: query
          required: false
          description: Part of the club's name
          schema:
            type: string
            maxLength: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubDirectory'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: getClubsDirectory
  /api/clubs/join-requests:
    get:
      tags:
        - Joining clubs
      summary: The user's open requests to join clubs
      responses:
        '200':
          description: OK
