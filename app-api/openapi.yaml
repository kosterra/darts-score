        thresholds:
          type: object
    IntegritySummary:
      type: object
      properties:
        impossible:
          type: integer
        errors:
          type: integer
        suspicious:
          type: integer
        open:
          type: integer
    PlayerClub:
      type: object
      properties:
        id:
          type: string
          description: MongoDB ObjectId
        name:
          type: string
        logo:
          type: string
        canManage:
          type: boolean
    ClockGameCreate:
      type: object
      required:
        - mode
        - players
      properties:
        mode:
          type: string
          enum:
            - Single
            - Double
            - Triple
            - All
        skipAhead:
          type: boolean
          description: 'In mode All: a double moves on two numbers, a treble three'
        players:
          type: array
          items:
            type: string
            description: MongoDB ObjectId
        numberOfPlayers:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
        flyingDarts:
          type: string
          enum:
            - players
            - 'on'
            - 'off'
        visits:
          $ref: '#/components/schemas/Visits'
    ClockGame:
      allOf:
        - $ref: '#/components/schemas/Timestamps'
        - type: object
          properties:
            id:
              type: string
              description: MongoDB ObjectId
            club:
              type: string
              description: MongoDB ObjectId
            mode:
              type: string
            skipAhead:
              type: boolean
            players:
              type: array
              items:
                type: string
                description: MongoDB ObjectId
            currentPlayerTurn:
              type: string
            gameIsRunning:
              type: boolean
            hasWinner:
              type: boolean
            visits:
              $ref: '#/components/schemas/Visits'
            throws:
              type: array
              items:
                type: integer
              description: The value of every dart (0 a miss, 1 a hit, with skipAhead 1–3); worked out from the visits (only in the answer for one game)
            playerModels:
              type: object
    X01Training:
      allOf:
        - $ref: '#/components/schemas/X01Game'
        - type: object
          properties:
            bot:
              type: object
              properties:
                average:
                  type: number
                checkoutRate:
                  type:
                    - number
                    - 'null'
                basis:
                  type: string
            player:
              type: object
              properties:
                id:
                  type: string
                  description: MongoDB ObjectId
                nickname:
                  type: string
                firstname:
                  type: string
                lastname:
                  type: string
                profileImg:
                  type: string
                user:
                  type:
                    - string
                    - 'null'
                  description: MongoDB ObjectId
      description: An X01 game against the bot (player id 'bot'); counts for no game statistics, badges or levels
    ClubShame:
      type: object
      properties:
        enabled:
          type: boolean
        minAge:
          type:
            - integer
            - 'null'
        badges:
          type: array
          items:
            type: object
    DashboardLayout:
      type: array
      maxItems: 40
      description: 'The widgets of a dashboard in their order, each with its width: S a third, M half, L two thirds, F the full width'
      items:
        type: object
        required:
          - id
          - size
        properties:
          id:
            type: string
            pattern: ^[A-Za-z0-9]{1,40}$
            example: leaderMostWins
          size:
            type: string
            enum:
              - S
              - M
              - L
              - F
