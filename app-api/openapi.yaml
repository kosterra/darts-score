  /api/stats/compare/duel:
    post:
      tags:
        - Statistics
      summary: The player comparison, head to head in one game type
      description: >-
        Two to eight players in their games together (or with others too) in one of the nine games (type x01, cricket, elimination,
        clock, shanghai, killer, halveit, golf, tactics), in one answer: playedGames; record (wins, for X01 legs, sets and the matches
        won in the deciding leg, the current streak, the last ten results, and pairs - who beats whom); each player's figures of the
        game (for the newer games worked out from their visits); games for the timeline; highlights of X01 (best game average, highest
        checkout with their game, 180s, and total180s - the player's 180s in all the club's games); shame (the Hall of Shame badges got in these games, where the club has one); badges (per player the badges earned in these games and their whole collection, { earned, total }); ratings (the
        club's Elo rating of each, provisional below 5 rated games) and chances (in percent for the next game); filterOptions (the X01
        formats played together and the club's formats of the game); and for X01 the chart data (x01).
      parameters:
        - $ref: '#/components/parameters/ClubId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - playerIds
              properties:
                playerIds:
                  type: array
                  maxItems: 8
                  items:
                    type: string
                type:
                  type: string
                  enum: [x01, cricket, elimination, clock, shanghai, killer, halveit, golf, tactics]
                includeOthers:
                  type: boolean
                dateFilter:
                  type: string
                from:
                  type: string
                to:
                  type: string
                lastGames:
                  type: integer
                startingScore:
                  type: integer
                format:
                  type: object
                friendly:
                  type: string
                  enum: [include, exclude]
                clubFormat:
                  type: string
                  description: The id of one of the club's formats
      responses:
        '200':
          description: The duel
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: A player is not known in the club
        '422':
          description: Unknown game type or more than 8 players
      operationId: postStatsCompareDuel
  /api/stats/compare/side:
    post:
      tags:
        - Statistics
      summary: The player comparison, each player on their own side by side
      description: >-
        Two to eight players with their figures from all their games, also when they never played each other: level, rating, badges,
        games, wins and win rate, per game type the games and wins, X01 (average, first 9, checkout rate, highest checkout, 180s,
        ton-plus, darts per leg, best leg), Cricket, Elimination and Around the Clock figures, the newer games, the bests of the
        trainings (left out for players who keep their trainings to themselves), and the chances for the next game. scope "club" (the
        default) or "all" clubs; dateFilter, from, to and lastGames as on a player's statistics.
      parameters:
        - $ref: '#/components/parameters/ClubId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - playerIds
              properties:
                playerIds:
                  type: array
                  maxItems: 8
                  items:
                    type: string
                scope:
                  type: string
                  enum: [club, all]
                dateFilter:
                  type: string
                from:
                  type: string
                to:
                  type: string
                lastGames:
                  type: integer
      responses:
        '200':
          description: The players side by side ({ players, chances })
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: A player is not known in the club
        '422':
          description: More than 8 players
      operationId: postStatsCompareSide
  /api/stats/compare/opponents/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags:
        - Statistics
      summary: Who a player played most often in the club
      description: The five most frequent opponents, [{ playerId, games }], for the quick picks of the comparison.
      parameters:
        - $ref: '#/components/parameters/ClubId'
      responses:
        '200':
          description: The opponents
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Player not found
      operationId: getStatsCompareOpponentsByid
  /api/stats/compare/rivals/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags:
        - Statistics
      summary: A player's head to head with the others of the club
      description: >-
        From the club's games: the opponent played most and least, the one with the best record and the toughest (both from minGames
        games on), each { playerId, games, wins, losses, type (the game type they play most), player }; opponents is how many
        different opponents there are.
      parameters:
        - $ref: '#/components/parameters/ClubId'
      responses:
        '200':
          description: The head to head
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Player not found
      operationId: getStatsCompareRivalsByid
  /api/stats/players/form:
    post:
      tags:
        - Statistics
      summary: The recent form of players
      description: "The average of their last 5 X01 games against the 5 before, whether it is rising or falling, and the figures of both (figures.recent, figures.previous: checkoutRate, tonPlus, under10, under30, under50 as % of the scoring visits with more than 100 left, oneOrFive as % of their darts in the 1 or 5, dartsPerLeg of the legs won, firstNine, oneEighties, and shameBadges where the club has a Hall of Shame and the player counts for it)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - playerIds
              properties:
                playerIds:
                  type: array
                  items:
                    type: string
                    description: MongoDB ObjectId
      responses:
        '200':
          description: Player id → form
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    games:
                      type: integer
                    recentAverage:
                      type: number
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters:
        - $ref: '#/components/parameters/ClubId'
      operationId: postStatsPlayersForm
  /api/games/deletion-requests:
    get:
      tags:
        - Deletion requests
      summary: The open requests of the club
      responses:
        '200':
          description: The requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeletionRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters:
        - $ref: '#/components/parameters/ClubId'
      operationId: getGamesDeletionRequests
    post:
      tags:
        - Deletion requests
      summary: Ask to delete a game one played
      description: >-
        The asking user's players agree with it. When every player of the game has a login and all agreed, the game is deleted at once;
        otherwise the other players and the club admins are asked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - game
              properties:
                type:
                  type: string
                  enum:
                    - x01
                    - cricket
                    - elimination
                    - clock
                game:
                  type: string
                  description: MongoDB ObjectId
                reason:
                  type: string
                  maxLength: 300
      responses:
        '201':
          description: The request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
        - $ref: '#/components/parameters/ClubId'
      operationId: postGamesDeletionRequests
  /api/games/deletion-requests/{id}:
