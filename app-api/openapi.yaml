  /api/players/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags:
        - Players
      summary: Get a single player
      responses:
        '200':
          description: Player
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
        - $ref: '#/components/parameters/ClubId'
      operationId: getPlayersByid
    put:
      tags:
        - Players
      summary: Update a player
      description: >-
        Accepts `multipart/form-data`. If a new `profileImg` file is provided the existing image is deleted first. If `clearProfileImg=true`
        is sent without a new file the image is removed.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/PlayerFormData'
                - type: object
                  properties:
                    clearProfileImg:
                      type: string
                      enum:
                        - 'true'
                      description: Set to "true" to explicitly remove the current profile image
                    country:
                      type: string
                      pattern: '^([A-Za-z]{2}(-[A-Za-z]{3})?)?$'
                      description: Where the player comes from (CH, GB-ENG, …); empty for none. A player with a login sets it for all the players of their account
      responses:
        '200':
          description: Update confirmation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
      parameters:
        - $ref: '#/components/parameters/ClubId'
      operationId: putPlayersByid
    delete:
      tags:
        - Players
      summary: Delete a player
      description: Deletes the player record and removes their profile image file. Club admins only.
      responses:
        '200':
          description: Deletion confirmation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
        - $ref: '#/components/parameters/ClubId'
      operationId: deletePlayersByid
  /api/players/{id}/visibility:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags:
        - Players
      summary: Show or hide a player's nickname on the public start page (club admins, or the player themselves)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - publicProfile
              properties:
                publicProfile:
                  type: boolean
      responses:
        '200':
          description: Setting saved
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters:
        - $ref: '#/components/parameters/ClubId'
      operationId: putPlayersByidVisibility
  /api/players/{id}/training-privacy:
    put:
      tags:
        - Players
      summary: Whether the other players see the trainings
      description: The player themselves or a club admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - privateTrainings
              properties:
                privateTrainings:
                  type: boolean
      responses:
        '200':
          description: The player
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/Id'
      operationId: putPlayersByidTrainingPrivacy
  /api/players/{id}/preferences:
    put:
      tags:
        - Players
      summary: Ways out and darts of a player
      description: The player themselves or a club admin. A flight shape, design or barrel has to be owned first (403 otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerPreferences'
      responses:
        '200':
          description: The player
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/Id'
      operationId: putPlayersByidPreferences
  /api/players/{id}/flights:
    get:
      tags:
        - Flights
      summary: Flight points and what a player owns
      description: >-
        Worked out from the player's games and trainings in all clubs: the points earned and spent, and every flight shape, design and
        barrel as owned, to unlock or locked (with what is missing).
      responses:
        '200':
          description: The standing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightStanding'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/Id'
      operationId: getPlayersByidFlights
  /api/players/{id}/flights/unlock:
    post:
      tags:
        - Flights
      summary: Unlock a flight shape, design or barrel
      description: With the flight points of the player; the player themselves or a club admin. Fails when a level, an average or points are missing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - kind
                - id
              properties:
                kind:
                  type: string
                  enum:
                    - shape
                    - design
                    - barrel
                id:
                  type: string
      responses:
        '200':
          description: The new standing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightStanding'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/Id'
      operationId: postPlayersByidFlightsUnlock
  /api/players/{id}/account:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags:
        - Players
      summary: Give a player a login (club admins only); creates the account when the email is unknown
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerLoginInput'
      responses:
        '200':
          description: Player linked to the account
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The account already plays in this club as another player
        '422':
          description: Initial password missing for a new account
      parameters:
        - $ref: '#/components/parameters/ClubId'
      operationId: putPlayersByidAccount
    delete:
      tags:
        - Players
      summary: Take the login away from a player (club admins only); the account itself stays
      responses:
        '200':
          description: Login removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters:
        - $ref: '#/components/parameters/ClubId'
      operationId: deletePlayersByidAccount
  /api/players/{id}/account/invite:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags:
        - Players
      summary: Send the invitation of a player's login again (club admins only)
      description: With a new link to choose the password, while the login was never used.
      parameters:
        - $ref: '#/components/parameters/ClubId'
      responses:
        '200':
          description: Sent
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The player has no login
        '409':
          description: The login was used already
        '503':
          description: Email sending is not set up
      operationId: postPlayersByidAccountInvite
  /api/players/{id}/contact:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags:
        - Players
      summary: The address the club keeps for a player without a login (club admins only)
      parameters:
        - $ref: '#/components/parameters/ClubId'
      responses:
        '200':
          description: The address and the open claim links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerContact'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      operationId: getPlayersByidContact
    put:
      tags:
        - Players
      summary: Keep an address for a player without a login, with their consent (club admins only)
      parameters:
        - $ref: '#/components/parameters/ClubId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - consent
              properties:
                email:
                  type: string
                  format: email
                topics:
                  type: array
                  items:
                    type: string
                    enum: [badges, level, records, weeklySummary]
                language:
                  $ref: '#/components/schemas/Language'
                consent:
                  type: boolean
                  description: The admin confirms the player agreed to get these mails
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerContact'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The player has a login, or is a guest
        '422':
          description: No valid address, or no consent
      operationId: putPlayersByidContact
    delete:
      tags:
        - Players
      summary: Forget the address of a player without a login (club admins only)
      parameters:
        - $ref: '#/components/parameters/ClubId'
      responses:
        '200':
          description: Forgotten
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerContact'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      operationId: deletePlayersByidContact
  /api/players/{id}/claim:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags:
        - Players
      summary: A new claim link of a player without a login (club admins only)
      description: Whoever opens it creates an account, or logs in, and takes over the player with all their games, statistics and badges. Valid for 30 days.
      parameters:
        - $ref: '#/components/parameters/ClubId'
      responses:
        '201':
          description: The link
          content:
            application/json:
              schema:
                type: object
                properties:
                  link:
                    type: string
                  days:
                    type: integer
                  expiresAt:
                    type: string
                    format: date-time
                  claims:
                    $ref: '#/components/schemas/PlayerClaims'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The player has a login already
      operationId: postPlayersByidClaim
    delete:
      tags:
        - Players
      summary: Make every open claim link of a player stop working (club admins only)
      parameters:
        - $ref: '#/components/parameters/ClubId'
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema:
                type: object
                properties:
                  claims:
                    $ref: '#/components/schemas/PlayerClaims'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      operationId: deletePlayersByidClaim
  /api/players/{id}/clubs:
    get:
      tags:
        - Players
      summary: The clubs of a player
      description: Club admins only; each club says whether the user manages it.
      responses:
        '200':
          description: The clubs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlayerClub'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/Id'
      operationId: getPlayersByidClubs
    post:
      tags:
        - Players
      summary: Add a player to another club, or move them
      description: Club admins, to clubs they also manage. Moving takes the history along.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - club
              properties:
                club:
                  type: string
                  description: MongoDB ObjectId
                move:
                  type: boolean
      responses:
        '200':
          description: The player
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/Id'
      operationId: postPlayersByidClubs
  /api/players/{id}/clubs/{clubId}:
    delete:
      tags:
        - Players
      summary: Remove a player from another club
      responses:
        '200':
          description: The player
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/Id'
        - name: clubId
          in: path
          required: true
          schema:
            type: string
      description: Club admins only.
      operationId: deletePlayersByidClubsByclubId
  /api/stats/first-steps:
    get:
      tags:
        - Statistics
      summary: The first steps of the user in the selected club, ticked from what is there
      description: For an admin of the club its face (logo or description), its players, how it plays, the first game and the own player; for a member the own player, the first game, a training and the notifications. Whether Legmate is installed as an app is told by the device (done null).
      operationId: getStatsFirstSteps
      responses:
        '200':
          description: The steps
          content:
            application/json:
              schema:
                type: object
                properties:
                  role:
                    type: string
                    enum: [admin, member]
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        done:
                          type: [boolean, 'null']
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/stats/favourites:
    get:
      tags:
        - Statistics
      summary: The games the user's player played most in the last 90 days (same game, settings and opponents), the most played first, at most three
      responses:
        '200':
          description: '[{ id, type, kind, settings, players, opponents, count, lastAt, lastSettings }]'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters:
        - $ref: '#/components/parameters/ClubId'
      operationId: getStatsFavourites
  /api/stats/favourites/{id}/start:
    post:
      tags:
        - Statistics
      summary: Start a favourite again with the same settings and opponents; the player who threw first last time throws last
      responses:
        '201':
          description: '{ type, kind, id, path: where the app plays it }'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The favourite is no longer there
        '409':
          description: The club's rules no longer allow it
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - name: id
          in: path
          required: true
          schema:
            type: string
      operationId: postStatsFavouritesByidStart
  /api/stats/club:
    get:
      tags:
        - Statistics
      summary: Club dashboard data - facts about the club (with its latest club badges and how many of all it has), leaderboards over all finished games, recent and running games
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters:
        - $ref: '#/components/parameters/ClubId'
      operationId: getStatsClub
  /api/stats/levels:
    get:
      tags:
        - Statistics
      summary: The level of every member of the selected club (id, name, index, xp)
      parameters:
        - $ref: '#/components/parameters/ClubId'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      operationId: getStatsLevels
  /api/stats/games:
    get:
      tags:
        - Statistics
      summary: The games of the club at a glance, over all of them
      description: How many games (in all, in the last 30 days, running), how many members play, the game types by how often they are played (the newer games by their kind), the members ranked by their games with wins, games lately and the type they play most, and the best win rates (from 5 finished games).
      responses:
        '200':
          description: '{ total, last30Days, running, players, popular, ranking, winRates, playersById }'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters:
        - $ref: '#/components/parameters/ClubId'
      operationId: getStatsGames
  /api/stats/badges:
    get:
      tags:
        - Statistics
      summary: Badge overview of the club - every player with their number of badges and the latest ones
      description: Also the badges earned in all and in the last 30 days, the players collecting, the badges earned lately in the club (recent), the rarest ones held by one or two players (rare) and those nobody has yet, first tiers first (unclaimed).
      responses:
        '200':
          description: 'The overview: { total, earned, earnedLast30Days, collectors, players, recent, rare, unclaimed }'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters:
        - $ref: '#/components/parameters/ClubId'
      operationId: getStatsBadges
  /api/stats/shame:
    get:
      tags:
        - Statistics
      summary: The Hall of Shame of the club
      description: Who holds each shame badge; players without a date of birth and (if the club says so) children are left out.
      responses:
        '200':
          description: The holders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubShame'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters:
        - $ref: '#/components/parameters/ClubId'
      operationId: getStatsShame
  /api/stats/club-badges:
    get:
      tags:
        - Statistics
      summary: The badges the club earned together, and its goals
      description: >-
        Every club badge (club games, darts, 180s together, club night, every week, members, anniversary, every game, every
        training, and the club's firsts: 180, big fish, nine-darter, Shanghai finish), earned ones with the date, the game or
        training that tipped it and the player's nickname, the others with the progress towards them; and the club's goals with
        how far each is. Club badges add no XP.
      responses:
        '200':
          description: The club badges ({ earnedCount, total, badges, goals })
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters:
        - $ref: '#/components/parameters/ClubId'
      operationId: getStatsClubBadges
  /api/stats/badges/player/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags:
        - Statistics
      summary: All badges for one player - earned ones with date and source, open ones with progress
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
        - $ref: '#/components/parameters/ClubId'
      operationId: getStatsBadgesPlayerByid
  /api/stats/badges/game/{type}/{id}:
    parameters:
      - name: type
        in: path
        required: true
        schema:
          type: string
          enum:
            - x01
            - cricket
            - elimination
      - $ref: '#/components/parameters/Id'
    get:
      tags:
        - Statistics
      summary: The badges each player earned in one game
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
        - $ref: '#/components/parameters/ClubId'
      operationId: getStatsBadgesGameBytypeByid
  /api/stats/player/{id}:
    get:
      tags:
        - Statistics
      summary: Get overall statistics for a player
      description: >-
        Key figures, levels, charts and badges of a player, in the club or all clubs, filtered like the profile. trainingSummary puts all
        their trainings in one: how many, in the last 30 days and when last, and the bests of each kind (Around the Clock, X01 against the
        bot, Bob's 27 and the other trainings of the rules engine). Trainings a player keeps to themselves are left out for the other players.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/Id'
        - name: scope
          in: query
          required: false
          description: The games of this club or of all clubs
          schema:
            type: string
            enum:
              - club
              - all
        - name: period
          in: query
          required: false
          description: The last week, month or year, or a custom period with from and to
          schema:
            type: string
            enum:
              - All
              - 1 W
              - 1 M
              - 1 Y
              - Custom
            default: All
        - name: from
          in: query
          required: false
          description: Start of a custom period
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: End of a custom period
          schema:
            type: string
            format: date
        - name: lastGames
          in: query
          required: false
          description: Only the last games
          schema:
            type: integer
        - name: startingScore
          in: query
          required: false
          description: Only X01 games of this starting score
          schema:
            type: integer
        - name: setMode
          in: query
          required: false
          description: Only X01 games of this format
          schema:
            type: string
        - name: numberOfSets
          in: query
          required: false
          description: Only X01 games of this format
          schema:
            type: integer
        - name: legMode
          in: query
          required: false
          description: Only X01 games of this format
          schema:
            type: string
        - name: numberOfLegs
          in: query
          required: false
          description: Only X01 games of this format
          schema:
            type: integer
      responses:
        '200':
          description: Player statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      operationId: getStatsPlayerByid
  /api/stats/player/{id}/games:
    get:
      tags:
        - Statistics
      summary: The latest games of a player
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - name: limit
          in: query
          required: false
          description: How many of each game type
          schema:
            type: integer
            default: 5
            maximum: 50
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The games
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      operationId: getStatsPlayerByidGames
  /api/stats/games/x01/{id}:
    get:
      tags:
        - Statistics
