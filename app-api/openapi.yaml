  /api/clubs/{id}/join:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags:
        - Joining clubs
      summary: Join an open club at once, or ask to join a club whose admins accept new members
      description: The user's player in another club joins the club too, with its statistics and badges; without one a new player is made with the nickname. The admins are notified.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname:
                  type: string
                  minLength: 3
                  maxLength: 25
                  description: Only needed without a player in another club
                message:
                  type: string
                  maxLength: 300
                  description: A few words for the admins
      responses:
        '201':
          description: 'status "member": joined; status "pending": asked, the admins decide'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - member
                      - pending
                  club:
                    type: string
                  player:
                    type: object
                  request:
                    $ref: '#/components/schemas/JoinRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The club takes no members on their own, or the user is a global admin
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A member already, asked already, or declined less than 7 days ago
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Too many open requests
      operationId: postClubsByidJoin
    delete:
      tags:
        - Joining clubs
      summary: Take back the open request to join the club
      responses:
        '200':
          description: The request, now withdrawn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: deleteClubsByidJoin
  /api/clubs/{id}/join-requests:
    parameters:
