        - Statistics
      summary: The player comparison, each player on their own side by side
      description: >-
        Two to eight players with their figures from all their games, also when they never played each other: level, rating, badges,
        games, wins and win rate, per game type the games and wins, X01 (average, first 9, checkout rate, highest checkout, 180s,
        ton-plus, darts per leg, best leg), Cricket, Elimination and Around the Clock figures, the newer games, the bests of the
        trainings (left out for players who keep their trainings to themselves), and the chances for the next game. scope "club" (the
        default) or "all" clubs; dateFilter, from, to and lastGames as on a player's statistics.
      parameters:
        - $ref: '#/components/parameters/ClubId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
