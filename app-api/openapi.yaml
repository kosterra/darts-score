            currentLegThrows:
              type: array
              items:
                type: object
            allSetsThrows:
              type: object
              description: The finished legs by set and leg, visit by visit with what was left; worked out from the visits (only in the answer for one game)
            playerModels:
              type: object
              description: Keyed by player ID; contains per-player scoring state, averages, checkout data, etc.
