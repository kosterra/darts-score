    PlayerFormData:
      type: object
      required:
        - firstname
        - lastname
        - nickname
      properties:
        firstname:
          type: string
          minLength: 3
          maxLength: 25
          example: John
        lastname:
          type: string
          minLength: 3
          maxLength: 25
          example: Doe
        nickname:
          type: string
          minLength: 3
          maxLength: 25
          example: Bullseye
        profileImg:
          type: string
          format: binary
          description: PNG or JPEG image file (optional)
    Visits:
      type: array
      description: Every visit in order. X01, Cricket, Elimination and Around the Clock are stored as their visits; the results (playerModels, whose turn it is, whether it is over) are worked out from them by the API, whatever else is sent. A game sent with the fields of an older app (allSetsThrows, allThrows, throws) is read from those.
      items:
        type: object
        required:
          - player
          - darts
        properties:
          player:
            type: string
            description: The player who threw
          darts:
            type: array
            maxItems: 3
            items:
              type: string
              pattern: '^(0|[SDT]([1-9]|1\d|20)|[SD]25)$'
              example: T20
    X01GameCreate:
      type: object
      required:
        - startingScore
        - setMode
        - legMode
        - legInMode
        - legOutMode
        - numberOfPlayers
        - players
      properties:
        startingScore:
          type: integer
          enum:
            - 101
            - 170
            - 201
            - 301
            - 401
            - 501
            - 601
            - 701
            - 801
            - 901
            - 1001
          example: 501
        setMode:
          type: string
          enum:
            - Best of
            - First to
        legMode:
          type: string
          enum:
            - Best of
            - First to
        legInMode:
          type: string
          enum:
            - Straight In
            - Double In
            - Master In
        legOutMode:
          type: string
          enum:
            - Straight Out
            - Double Out
            - Master Out
        numberOfSets:
          type: integer
          example: 1
        numberOfLegs:
          type: integer
          example: 3
        numberOfPlayers:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
        players:
          type: array
          items:
            type: string
          description: Array of player IDs
        isSoloGame:
          type: boolean
          default: false
        flyingDarts:
          type: string
          enum:
            - players
            - 'on'
            - 'off'
          description: 'Whether the darts fly onto the board: as each player set it (''players''), or on or off for everyone'
        visits:
          $ref: '#/components/schemas/Visits'
        handicap:
          type: object
          description: 'The players'' own rules: { [playerId]: { startingScore, legInMode, legOutMode } }'
        starter:
          type: string
          description: Who throws first when not the first player (games of earlier versions of the app)
    X01Game:
      allOf:
        - $ref: '#/components/schemas/Timestamps'
        - $ref: '#/components/schemas/X01GameCreate'
