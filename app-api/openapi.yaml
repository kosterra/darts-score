  /api/stats/player/{id}:
    get:
      tags:
        - Statistics
      summary: Get overall statistics for a player
      description: >-
        Key figures, levels, charts and badges of a player, in the club or all clubs, filtered like the profile. trainingSummary puts all
        their trainings in one: how many, in the last 30 days and when last, and the bests of each kind (Around the Clock, X01 against the
        bot, Bob's 27 and the other trainings of the rules engine). Trainings a player keeps to themselves are left out for the other players.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/Id'
        - name: scope
          in: query
          required: false
          description: The games of this club or of all clubs
          schema:
            type: string
            enum:
              - club
              - all
        - name: period
          in: query
          required: false
          description: The last week, month or year, or a custom period with from and to
          schema:
            type: string
            enum:
              - All
              - 1 W
              - 1 M
              - 1 Y
              - Custom
            default: All
        - name: from
          in: query
          required: false
          description: Start of a custom period
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: End of a custom period
          schema:
            type: string
            format: date
        - name: lastGames
          in: query
          required: false
          description: Only the last games
          schema:
            type: integer
        - name: startingScore
          in: query
          required: false
          description: Only X01 games of this starting score
          schema:
            type: integer
        - name: setMode
          in: query
          required: false
          description: Only X01 games of this format
          schema:
            type: string
        - name: numberOfSets
          in: query
          required: false
          description: Only X01 games of this format
          schema:
            type: integer
        - name: legMode
          in: query
          required: false
          description: Only X01 games of this format
          schema:
            type: string
        - name: numberOfLegs
          in: query
          required: false
          description: Only X01 games of this format
          schema:
            type: integer
      responses:
        '200':
          description: Player statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
