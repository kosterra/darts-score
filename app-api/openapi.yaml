        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [backup]
              properties:
                backup:
                  type: string
                  format: binary
      responses:
        '201':
          description: The uploaded backup, '{ name, kind, createdAt, size }'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Global admin rights required
        '422':
          description: No file, or not a backup of Legmate
      operationId: postAdminBackupsUpload
  /api/admin/backups/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: The file name of the backup, legmate-YYYYMMDD-HHmmss-{manual|auto|before-restore|upload}.json.gz
        schema:
          type: string
    get:
      tags:
        - Administration
      summary: Download a backup
      responses:
        '200':
          description: The gzipped backup file
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Global admin rights required
        '404':
          description: There is no such backup
      operationId: getAdminBackupsByname
    delete:
      tags:
        - Administration
      summary: Delete a backup
      responses:
        '200':
          description: The backup is deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Global admin rights required
        '404':
          description: There is no such backup
        '409':
          description: A backup or a restore is running
      operationId: deleteAdminBackupsByname
  /api/admin/backups/{name}/restore:
    parameters:
      - name: name
        in: path
        required: true
        description: The file name of the backup, legmate-YYYYMMDD-HHmmss-{manual|auto|before-restore|upload}.json.gz
        schema:
          type: string
    post:
      tags:
        - Administration
      summary: Put a backup back; a backup of the state before is made first. In production the API starts again afterwards.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: string
                  enum: [RESTORE]
      responses:
        '200':
          description: '{ counts, before: the backup of the state before, restart: whether the API starts again }'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Global admin rights required
        '404':
          description: There is no such backup
        '409':
          description: A backup or a restore is running
        '422':
          description: Not confirmed, or not a backup of Legmate
      operationId: postAdminBackupsBynameRestore
