  /api/tournaments:
    get:
      tags:
        - Tournaments
      summary: The club's tournaments, the newest first, and whether a new one can be set up (enough members); ?active=1 only those the dashboard shows
      responses:
        '200':
          description: '{ min, eligible, canCreate, tournaments: [the tournament as GET /api/tournaments/{id}] }'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a member of the club, or (where the club admins do it) not one of its admins
      parameters:
        - $ref: '#/components/parameters/ClubId'
      operationId: getTournaments
    post:
      tags:
        - Tournaments
      summary: Set up a tournament, as a draft or with its registration open at once (club admins; the club needs at least 4 members)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - closesAt
                - rounds
              properties:
                name:
                  type: string
                  maxLength: 80
                description:
                  type: string
                  maxLength: 1000
                maxPlayers:
                  type: integer
                  enum: [8, 16, 32, 64]
                closesAt:
                  type: string
                  format: date-time
                invite:
                  type: string
                  enum: [mail, notification, banner]
                  description: 'How the members hear of the registration: in the app and by mail as each chose (mail), only in the app (notification), or only from the banner on the dashboard (banner)'
                preset:
                  type: string
                  description: clubNight, clubClassic, miniWorld, playersChampionship, europeanTour, worldMatchplay or worldChampionship
                rounds:
                  type: array
                  description: Each round by how many players are left in it (size 64 … 2), with its day and its X01 rules
                  items:
                    type: object
                    properties:
                      size:
                        type: integer
                      date:
                        type: string
                        format: date-time
                      rules:
                        type: object
                        description: startingScore, legInMode, legOutMode, setMode, numberOfSets, legMode, numberOfLegs
                open:
                  type: boolean
                  description: Open the registration at once (new tournaments only)
      responses:
        '201':
          description: 'The tournament as the app shows it: setup, status, rounds, entries, matches, the names of its players (players), counts of the registration, and the entry of the player asking (me)'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a member of the club, or (where the club admins do it) not one of its admins
        '409':
          description: Not possible in the state the tournament is in
        '422':
          description: What was sent cannot be taken
      parameters:
        - $ref: '#/components/parameters/ClubId'
      operationId: postTournaments
