      operationId: putTournamentsByidEntriesByplayerId
  /api/tournaments/{id}/draw:
    post:
      tags:
        - Tournaments
      summary: 'Hold the draw: seeded by the club rating (the best quarter apart, byes to the first seeds) or at random (club admins)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                seeding:
                  type: string
                  enum: [seeded, random]
      responses:
        '200':
          description: 'The tournament as the app shows it: setup, status, rounds, entries, matches, the names of its players (players), counts of the registration, and the entry of the player asking (me)'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a member of the club, or (where the club admins do it) not one of its admins
        '404':
          description: No such tournament (drafts only for the admins)
        '409':
          description: Not possible in the state the tournament is in
        '422':
          description: What was sent cannot be taken
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - name: id
          in: path
          required: true
          schema:
            type: string
      operationId: postTournamentsByidDraw
  /api/tournaments/{id}/matches/{match}/start:
    post:
      tags:
        - Tournaments
      summary: Start a match as an X01 game with the rules of its round (its players or a club admin); a running match answers with its game
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first:
                  type: [string, 'null']
                  description: The player who throws first
      responses:
        '201':
          description: '{ game: the id of the X01 game }'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a member of the club, or (where the club admins do it) not one of its admins
        '404':
          description: No such tournament (drafts only for the admins)
        '409':
          description: Not possible in the state the tournament is in
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: match
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d+-\d+$'
      operationId: postTournamentsByidMatchesBymatchStart
  /api/tournaments/{id}/matches/{match}/result:
    put:
      tags:
        - Tournaments
      summary: 'Decide a match without a game: a walkover or a result agreed elsewhere (club admins)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - winner
              properties:
                winner:
                  type: string
      responses:
        '200':
          description: 'The tournament as the app shows it: setup, status, rounds, entries, matches, the names of its players (players), counts of the registration, and the entry of the player asking (me)'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a member of the club, or (where the club admins do it) not one of its admins
        '404':
          description: No such tournament (drafts only for the admins)
        '409':
          description: Not possible in the state the tournament is in
        '422':
          description: What was sent cannot be taken
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: match
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d+-\d+$'
      operationId: putTournamentsByidMatchesBymatchResult
  /api/tournament-reply:
    get:
      tags:
        - Tournaments
      summary: What the link of a tournament invitation is about, without logging in
      responses:
        '200':
          description: '{ tournament: { id, name, status, closesAt, maxPlayers, entered }, club, nickname, answer, open }'
        '404':
          description: The link is not valid (any more)
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      operationId: getTournamentReply
    post:
      tags:
        - Tournaments
      summary: Enter or decline with the link of a tournament invitation, without logging in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - answer
              properties:
                token:
                  type: string
                answer:
                  type: string
                  enum: [in, out]
      responses:
        '200':
          description: '{ tournament: { id, name, status, closesAt, maxPlayers, entered }, club, nickname, answer, open }'
        '404':
          description: The link is not valid (any more)
        '409':
          description: Not possible in the state the tournament is in
        '422':
          description: What was sent cannot be taken
      operationId: postTournamentReply
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ds_session
  parameters:
    MailLanguage:
      name: language
      in: query
      required: false
      description: The language of the texts (English without it)
      schema:
        $ref: '#/components/schemas/Language'
    ClubId:
      name: X-Club-Id
      in: header
      required: true
      description: Club the request works in (required under /api/players, /api/games, /api/training and /api/stats)
      schema:
        type: string
    Id:
      name: id
      in: path
      required: true
      description: MongoDB ObjectId
      schema:
        type: string
      example: 64a1f3b2c8e4d500123abc01
    Limit:
      name: limit
      in: query
      description: Maximum number of results to return (max 100)
      schema:
        type: integer
        default: 100
        minimum: 1
        maximum: 100
    Skip:
      name: skip
      in: query
      description: Number of results to skip (for pagination)
      schema:
        type: integer
        default: 0
        minimum: 0
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
          example:
            message: Player not found.
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  properties:
                    msg:
                      type: string
                    path:
                      type: string
                    value:
                      type: string
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    Unauthorized:
      description: Not logged in, or the login has ended
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
          example:
            message: Please log in.
    Forbidden:
      description: The user may not do this (e.g. not an admin of the club, not their own player)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
          example:
            message: Only club admins can do this.
    Conflict:
      description: Not possible in the current state (e.g. already decided, not enough flight points)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
          example:
            message: This request is closed already.
  schemas:
    RegisterInput:
      type: object
      required:
        - email
        - password
        - firstname
        - lastname
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
        firstname:
          type: string
          minLength: 2
          maxLength: 25
        lastname:
          type: string
          minLength: 2
          maxLength: 25
        language:
          $ref: '#/components/schemas/Language'
        claimToken:
          type: string
          description: The token of a claim link; the new account takes over its player
    LegalSettings:
      type: object
      properties:
        operator:
          type: string
          maxLength: 200
          description: The person or organisation running the installation
        address:
          type: string
          maxLength: 500
        email:
          type: string
          maxLength: 254
        notes:
          type: string
          maxLength: 2000
          description: More for the privacy page, e.g. the hosting provider or a tunnel service
    MfaState:
      type: object
      properties:
        enabled:
          type: boolean
        required:
          type: boolean
        setupDue:
          type: [string, 'null']
          format: date-time
          description: Until when it may still be set up, while required and off
        mustSetUp:
          type: boolean
        recoveryLeft:
          type: integer
        enabledAt:
          type: [string, 'null']
          format: date-time
    MfaPolicy:
      type: object
      properties:
        policy:
          type: string
          enum: [off, optional, admins, everyone]
        graceDays:
          type: integer
        requiredSince:
          type: [string, 'null']
          format: date-time
        policies:
          type: array
          items:
            type: string
        graceLimits:
          type: object
          properties:
            default:
              type: integer
            min:
              type: integer
            max:
              type: integer
        ownEnabled:
          type: boolean
    NotificationChoice:
      type: object
      properties:
        inApp:
          type: boolean
          description: In the notification center
        mail:
          type: string
          enum: [off, instant, daily, weekly]
    NotificationSettings:
      type: object
      properties:
        mailEnabled:
          type: boolean
          description: Whether the installation sends mails
        groups:
          type: array
          items:
            type: string
            enum: [games, club, admin, global, security]
        topics:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              group:
                type: string
              locked:
                type: boolean
              mailOnly:
                type: boolean
              mails:
                type: array
                items:
                  type: string
              inApp:
                type: boolean
              mail:
                type: string
    Unsubscribed:
      type: object
      properties:
        type:
          type: string
          enum: [user, contact]
        topic:
          type: string
    PlayerClaims:
      type: object
      description: The open claim links of a player
      properties:
        count:
          type: integer
        until:
          type: [string, 'null']
          format: date-time
    PlayerContact:
      type: object
      properties:
        contact:
          type: [object, 'null']
          properties:
            email:
              type: string
            language:
              type: string
            topics:
              type: array
              items:
                type: string
            consentAt:
              type: string
              format: date-time
            consentByName:
              type: string
            unsubscribedAt:
              type: [string, 'null']
              format: date-time
        claims:
          $ref: '#/components/schemas/PlayerClaims'
        mailEnabled:
          type: boolean
    Language:
      type: string
      description: The language of the app, the mails and the messages of the API
      enum:
        - en
        - de
        - fr
        - it
        - es
    LoginInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    ProfileInput:
      type: object
      required:
        - email
        - firstname
        - lastname
      properties:
        email:
          type: string
          format: email
        firstname:
          type: string
        lastname:
          type: string
    PasswordInput:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
    EmailInput:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
    ResetInput:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8
          maxLength: 128
    ClubAdminInput:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
        firstname:
          type: string
          description: Needed when the email has no account yet
        lastname:
          type: string
          description: Needed when the email has no account yet
        password:
          type: string
          minLength: 8
          description: Initial password for a new account; without it an invitation is mailed
    PlayerLoginInput:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          description: Initial password for a new account; without it an invitation is mailed
    RulesGameInput:
      type: object
      required:
        - kind
        - players
      properties:
        kind:
          type: string
          enum:
            - shanghai
            - killer
            - halveit
            - golf
            - tactics
        players:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: string
            description: MongoDB ObjectId of a player
        settings:
          type: object
          description: 'The setup, e.g. { rounds: 7 }, or for Killer { lives: 3, numbers: { playerId: 7 } }'
        visits:
          type: array
          items:
            type: object
            properties:
              player:
                type: string
              darts:
                type: array
                maxItems: 3
                items:
                  type: string
                  pattern: '^(0|[SDT]([1-9]|1\\d|20)|[SD]25)$'
                  example: T20
        currentPlayerTurn:
          type:
            - string
            - 'null'
        gameIsRunning:
          type: boolean
        hasWinner:
          type: boolean
        playerModels:
          type: object
          description: 'Per player { score, rank, hasWonGame, darts }, worked out by the app'
        flyingDarts:
          type: string
          enum:
            - players
            - 'on'
            - 'off'
    RulesGame:
      allOf:
        - $ref: '#/components/schemas/RulesGameInput'
        - type: object
          properties:
            id:
              type: string
            type:
              type: string
              description: The kind again, as the type the app shows
            club:
              type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    RulesTrainingInput:
      type: object
      required:
        - kind
        - player
        - score
      properties:
        kind:
          type: string
          enum:
            - bobs27
            - checkout121
            - randomcheckouts
            - scoring
            - doublesaround
            - catch40
        player:
          type: object
          required:
            - id
          properties:
            id:
              type: string
        score:
          type: number
          description: What ranks the attempts (higher is better, for Doubles around the board lower)
        settings:
          type: object
        result:
          type: object
          description: What the app worked out, e.g. { score, done, attempts }
        darts:
          type: array
          items:
            type: string
            description: 'A dart (T20, D16, 0) or H and M for a hit or a miss'
    RulesTraining:
      allOf:
        - $ref: '#/components/schemas/RulesTrainingInput'
        - type: object
          properties:
            id:
              type: string
            club:
              type: string
            createdAt:
              type: string
              format: date-time
            isRecord:
              type: boolean
            previousBest:
              type:
                - number
                - 'null'
    ClubInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 50
        description:
          type: string
          maxLength: 500
        country:
          type: string
          pattern: '^([A-Za-z]{2}(-[A-Za-z]{3})?)?$'
          description: Where the club plays, as an ISO 3166 country code (CH, DE, …) or a nation of the United Kingdom (GB-ENG, GB-SCT, GB-WLS, GB-NIR); empty for none
        accent:
          type: [string, 'null']
          enum: [green, red, blue, gold, purple, null]
          description: "The club's accent colour in the app, for the members who did not choose their own (null or unknown: Legmate green)"
        isPublic:
          type: boolean
          description: List the club on the public start page
        publicLiveGames:
          type: boolean
          description: Show the running games of a public club
        publicResults:
          type: boolean
          description: Show the finished games of a public club
        shameBadges:
          type: boolean
          description: Keep the Hall of Shame
        shameWithoutChildren:
          type: boolean
          description: Leave children out of the Hall of Shame
        shameMinAge:
          type: integer
          minimum: 6
          maximum: 21
          description: From which age players count for the Hall of Shame
        joinPolicy:
          type: string
          enum:
            - open
            - approval
            - closed
          description: 'How new members join: at once (open), once an admin accepts (approval), or only added by the admins (closed, the default)'
        dashboardWidgets:
          type: array
          maxItems: 40
          items:
            type: string
          description: 'Replaced by dashboardLayout: the widget ids in order, without widths'
          deprecated: true
        dashboardLayout:
          $ref: '#/components/schemas/DashboardLayout'
          description: The club's dashboard, which its members see unless they arranged their own; an empty list means the default set
    JoinRequest:
      type: object
      properties:
        id:
          type: string
        club:
          type: string
        clubName:
          type: string
        clubLogo:
          type: string
        name:
          type: string
          description: The name of the one who asks
        email:
          type:
            - string
            - 'null'
          description: Only for the club admins
        nickname:
          type: string
        message:
          type: string
        status:
          type: string
          enum:
            - open
            - accepted
            - declined
            - withdrawn
        at:
          type: string
          format: date-time
        decidedAt:
          type:
            - string
            - 'null'
          format: date-time
    ClubDirectory:
      type: object
      properties:
        nickname:
          type:
            - string
            - 'null'
        clubs:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              description:
                type: string
              country:
                type: string
                description: ISO 3166 country code, empty when not set
              accent:
                type: [string, 'null']
                description: "The club's accent colour (null: Legmate green)"
              logo:
                type: string
              joinPolicy:
                type: string
                enum:
                  - open
                  - approval
              playerCount:
                type: integer
              isMember:
                type: boolean
              request:
                type:
                  - object
                  - 'null'
                description: The user's latest open or declined request to the club
                properties:
                  id:
                    type: string
                  status:
                    type: string
                  at:
                    type: string
                    format: date-time
                  decidedAt:
                    type:
                      - string
                      - 'null'
                    format: date-time
    MailTemplateInput:
      type: object
      required:
        - subject
        - body
        - button
      properties:
        subject:
          type: string
          maxLength: 150
        body:
          type: string
          maxLength: 4000
          description: Paragraphs separated by an empty line; placeholders like {{firstname}}
        button:
          type: string
          maxLength: 40
    RoleInput:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum:
            - globalAdmin
            - user
    NicknameInput:
      type: object
      required:
        - nickname
      properties:
        nickname:
          type: string
          minLength: 3
          maxLength: 25
    Message:
      type: object
      properties:
        message:
          type: string
      example:
        message: Player was updated successfully.
    Timestamps:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    GameFilterBody:
      type: object
      required:
        - playerIds
      properties:
        playerIds:
          type: array
          items:
            type: string
          description: Player IDs to match
          example:
            - 64a1f...
            - 64a2e...
        includeOthers:
          type: boolean
          description: If true, include games that also have additional players beyond the listed IDs
          default: false
        dateFilter:
          type: string
          description: Restrict games to a time window
          enum:
            - All
            - 1 W
            - 1 M
            - 1 Y
          default: All
    Player:
      allOf:
        - $ref: '#/components/schemas/Timestamps'
        - type: object
          properties:
            id:
              type: string
              description: MongoDB ObjectId
              example: 64a1f3b2c8e4d500123abc01
            firstname:
              type: string
              example: John
            lastname:
              type: string
              example: Doe
            nickname:
              type: string
              example: Bullseye
            profileImg:
              type: string
              description: Stored filename; served under /api/images/players/{profileImg}
              example: 9c3e7a1d-photo.jpg
            country:
