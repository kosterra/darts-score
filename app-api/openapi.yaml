components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ds_session
  parameters:
    ClubId:
      name: X-Club-Id
      in: header
      required: true
      description: Club the request works in (required under /api/players, /api/games, /api/training and /api/stats)
      schema:
        type: string
    Id:
      name: id
      in: path
      required: true
      description: MongoDB ObjectId
      schema:
        type: string
      example: 64a1f3b2c8e4d500123abc01
    Limit:
      name: limit
      in: query
      description: Maximum number of results to return (max 100)
      schema:
        type: integer
        default: 100
        minimum: 1
        maximum: 100
    Skip:
      name: skip
      in: query
      description: Number of results to skip (for pagination)
      schema:
        type: integer
        default: 0
        minimum: 0
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
          example:
            message: Player not found.
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  properties:
                    msg:
                      type: string
                    path:
                      type: string
                    value:
                      type: string
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    Unauthorized:
      description: Not logged in, or the login has ended
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
          example:
            message: Please log in.
    Forbidden:
      description: The user may not do this (e.g. not an admin of the club, not their own player)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
          example:
            message: Only club admins can do this.
    Conflict:
      description: Not possible in the current state (e.g. already decided, not enough flight points)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
          example:
            message: This request is closed already.
  schemas:
    RegisterInput:
      type: object
      required:
        - email
        - password
        - firstname
        - lastname
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
        firstname:
          type: string
          minLength: 2
          maxLength: 25
        lastname:
          type: string
          minLength: 2
          maxLength: 25
    LoginInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    ProfileInput:
      type: object
      required:
        - email
        - firstname
        - lastname
      properties:
        email:
          type: string
          format: email
        firstname:
          type: string
        lastname:
          type: string
    PasswordInput:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
    EmailInput:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
    ResetInput:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8
          maxLength: 128
    ClubAdminInput:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
        firstname:
          type: string
          description: Needed when the email has no account yet
        lastname:
          type: string
          description: Needed when the email has no account yet
        password:
          type: string
          minLength: 8
          description: Initial password for a new account; without it an invitation is mailed
    PlayerLoginInput:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          description: Initial password for a new account; without it an invitation is mailed
    ClubInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 50
        description:
          type: string
          maxLength: 500
        isPublic:
          type: boolean
          description: List the club on the public start page
        publicLiveGames:
          type: boolean
          description: Show the running games of a public club
        publicResults:
          type: boolean
          description: Show the finished games of a public club
        shameBadges:
          type: boolean
          description: Keep the Hall of Shame
        shameWithoutChildren:
          type: boolean
          description: Leave children out of the Hall of Shame
        shameMinAge:
          type: integer
          minimum: 6
          maximum: 21
          description: From which age players count for the Hall of Shame
        dashboardWidgets:
          type: array
          maxItems: 40
          items:
            type: string
          description: The ids of the dashboard widgets to show, in order; an empty list means the default set
    RoleInput:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum:
            - globalAdmin
            - user
    NicknameInput:
      type: object
      required:
        - nickname
      properties:
        nickname:
          type: string
          minLength: 3
          maxLength: 25
    Message:
      type: object
      properties:
        message:
          type: string
      example:
        message: Player was updated successfully.
    Timestamps:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    GameFilterBody:
      type: object
      required:
        - playerIds
      properties:
        playerIds:
          type: array
          items:
            type: string
          description: Player IDs to match
          example:
            - 64a1f...
            - 64a2e...
        includeOthers:
          type: boolean
          description: If true, include games that also have additional players beyond the listed IDs
          default: false
        dateFilter:
          type: string
          description: Restrict games to a time window
          enum:
            - All
            - 1 W
            - 1 M
            - 1 Y
          default: All
    Player:
      allOf:
        - $ref: '#/components/schemas/Timestamps'
        - type: object
          properties:
            id:
              type: string
              description: MongoDB ObjectId
              example: 64a1f3b2c8e4d500123abc01
            firstname:
              type: string
              example: John
            lastname:
              type: string
              example: Doe
            nickname:
              type: string
              example: Bullseye
            profileImg:
              type: string
              description: Stored filename; served under /api/images/players/{profileImg}
              example: 9c3e7a1d-photo.jpg
            dateOfBirth:
              type:
                - string
                - 'null'
              format: date
            clubs:
              type: array
              items:
                type: string
