openapi: 3.1.0
info:
  title: Oche API
  description: >-
    REST API for Oche, the darts club app: accounts, clubs, players, games (X01, Cricket, Elimination, Around the Clock), trainings (Around
    the Clock, X01 against the bot), statistics, badges and levels, flights to collect, fair play, deletion requests and notifications.


    **Authentication:** log in with `POST /api/auth/login`; the response sets a signed, HTTP-only session cookie that authenticates all
    further requests. A login lasts a set time (5 hours unless a global admin sets 1 to 24); `POST /api/auth/session/extend` starts it
    again. Without a valid login the API answers 401.


    **Clubs:** players, games, trainings and statistics belong to a club. Requests under `/api/players`, `/api/games`, `/api/training` and
    `/api/stats` name the club in an `X-Club-Id` header. The user must be an admin of that club or have a login for one of its players.
    Players read, play games and record trainings, ask to delete games, and look after their own player (nickname, picture, preferences,
    flights); managing players and deleting games is for club admins.


    **Global admins** look after the installation (`/api/admin`, `/api/users`) and belong to no club.
  version: 2026.10.11
  license:
    name: GPLv3
    url: https://www.gnu.org/licenses/gpl-3.0.html
servers:
  - url: http://localhost:3001
    description: Local development
security:
  - sessionCookie: []
tags:
  - name: Public
    description: What visitors see without a login
  - name: Auth
    description: Registration, login, the session and the logged-in user
  - name: Clubs
    description: Clubs of the logged-in user (all clubs for a global admin)
  - name: Users
    description: Accounts (global admins only)
  - name: Administration
    description: 'The installation: all clubs, players, games, trainings, banner, login length, error log, alerts and blocks (global admins only)'
  - name: Players
    description: The players of a club
  - name: Flights
    description: Flight points, and the flight shapes, designs and barrels a player collects
  - name: Player Images
    description: Player pictures and club logos
  - name: X01
    description: X01 games
  - name: Cricket
    description: Cricket games
  - name: Elimination
    description: Elimination games
  - name: Around the Clock
    description: Around the Clock games
  - name: ATC
    description: Around the Clock trainings
  - name: X01 training
    description: X01 trainings against the bot
  - name: Deletion requests
    description: Players ask to delete a game they played; the others agree, the club admins decide
  - name: Statistics
    description: Statistics of players, games and the club
  - name: Badges
    description: Badges, the Hall of Shame, levels and the flight catalogue
  - name: Fair play
    description: Games and trainings that cannot be real, wrong data or worth a look (club admins; global admins for every club)
  - name: Notifications
    description: The logged-in user's notifications
paths:
  /api/health:
    get:
      tags:
        - Auth
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: The server is running
      operationId: getHealth
  /api/auth/register:
    post:
      tags:
        - Auth
      summary: Register an account and log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: Account created; session cookie set
        '409':
          description: Email already registered
        '422':
          description: Validation failed
      operationId: postAuthRegister
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Logged in; session cookie set
        '401':
          description: Email or password is wrong
      operationId: postAuthLogin
  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: Log out
      security: []
      responses:
        '200':
          description: Session cookie cleared
      operationId: postAuthLogout
  /api/auth/config:
    get:
      tags:
        - Auth
      summary: Whether the server can send mails (password reset, invitations)
      security: []
      responses:
        '200':
          description: OK
      operationId: getAuthConfig
  /api/auth/forgot-password:
    post:
      tags:
        - Auth
      summary: Mail a password reset link
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailInput'
      responses:
        '200':
          description: Always the same answer, whether or not the account exists
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: Email sending is not set up
      operationId: postAuthForgotPassword
  /api/auth/reset-password:
    post:
      tags:
        - Auth
      summary: Set a new password with the token from a reset or invitation mail and log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetInput'
      responses:
        '200':
          description: Password set; session cookie set
        '400':
          description: Link invalid or expired
      operationId: postAuthResetPassword
  /api/auth/me:
    get:
      tags:
        - Auth
      summary: The logged-in user
      responses:
        '200':
          description: OK
        '401':
          description: Not logged in
      operationId: getAuthMe
    put:
      tags:
        - Auth
      summary: Update own name and email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileInput'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Email already registered
      operationId: putAuthMe
  /api/auth/session:
    get:
      tags:
        - Auth
      summary: When the login ends
      responses:
        '200':
          description: The end of the login and its length
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: getAuthSession
  /api/auth/players:
    get:
      tags:
        - Auth
      summary: The user's own players
      description: Every player the user plays as, with their clubs, preferences and whether they may correct their date of birth.
      responses:
        '200':
          description: The players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyPlayer'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: getAuthPlayers
  /api/auth/session/extend:
    post:
      tags:
        - Auth
      summary: Stay logged in
      description: Starts the login again for the full length (e.g. from the countdown before it ends).
      responses:
        '200':
          description: The new end
          content:
            application/json:
              schema:
                type: object
                properties:
                  expiresAt:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: postAuthSessionExtend
  /api/auth/password:
    put:
      tags:
        - Auth
      summary: Change own password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordInput'
      responses:
        '200':
          description: Password changed; other sessions are logged out
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Current password is wrong
      operationId: putAuthPassword
  /api/public/overview:
    get:
      tags:
        - Public
      summary: Data of the public start page - totals, public clubs, their running games and latest results
      description: Needs no login. Only public clubs appear, and players are named only when their nickname is set to public.
      security: []
      responses:
        '200':
          description: OK
      operationId: getPublicOverview
  /api/public/banner:
    get:
      tags:
        - Public
      summary: The banner shown on top of every page while it is switched on ({ enabled, text, color })
      security: []
      responses:
        '200':
          description: OK
      operationId: getPublicBanner
  /api/clubs:
    get:
      tags:
        - Clubs
      summary: Clubs the user is an admin or a player of, with that role (global admins find every club under /api/admin/overview)
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: getClubs
    post:
      tags:
        - Clubs
      summary: Create a club with the logged-in user as its admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClubInput'
      responses:
        '201':
          description: Club created
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: postClubs
  /api/clubs/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags:
        - Clubs
      summary: Change a club's name and public visibility settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClubInput'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: No access to this club
      operationId: putClubsByid
    delete:
      tags:
        - Clubs
      summary: Delete a club and its games (a global admin also deletes its players)
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The club still has players (only for club admins)
      operationId: deleteClubsByid
  /api/clubs/{id}/logo:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags:
        - Clubs
      summary: Upload a new logo for the club (multipart field "logo", .png or .jpg)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                logo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Logo saved
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: No valid image
      operationId: putClubsByidLogo
    delete:
      tags:
        - Clubs
      summary: Remove the club's logo
      responses:
        '200':
          description: Logo removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      operationId: deleteClubsByidLogo
  /api/clubs/{id}/admins:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags:
        - Clubs
      summary: Add an admin; creates the account when the email is unknown
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClubAdminInput'
      responses:
        '201':
          description: Admin added
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Already an admin of the club
        '422':
          description: Names or initial password missing for a new account
      operationId: postClubsByidAdmins
  /api/clubs/{id}/admins/{userId}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: userId
        in: path
        required: true
        schema:
          type: string
    delete:
      tags:
        - Clubs
      summary: Remove an admin from the club
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A club needs at least one admin
      operationId: deleteClubsByidAdminsByuserId
  /api/users:
    get:
      tags:
        - Users
      summary: All users with the clubs they belong to, their role there and their last login
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Global admin rights required
      description: Global admins only.
      operationId: getUsers
  /api/users/{id}/role:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags:
        - Users
      summary: Change the role of a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleInput'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: You cannot change your own role
      description: Global admins only.
      operationId: putUsersByidRole
  /api/users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags:
        - Users
      summary: Delete a user
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The user is the only admin of a club, or is yourself
      description: Global admins only.
      operationId: deleteUsersByid
    put:
      tags:
        - Users
      summary: Correct an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - firstname
                - lastname
              properties:
                email:
                  type: string
                firstname:
                  type: string
                lastname:
                  type: string
      responses:
        '200':
          description: The account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      description: Global admins only.
      operationId: putUsersByid
  /api/users/{id}/password:
    put:
      tags:
        - Users
      summary: Set a new password for an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Done.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters:
        - $ref: '#/components/parameters/Id'
      description: Global admins only.
      operationId: putUsersByidPassword
  /api/users/{id}/password-link:
    post:
      tags:
        - Users
      summary: Create a link to choose a password
      description: 'For users without mail: a link to pass on, valid for a few hours. Global admins only.'
      responses:
        '200':
          description: The link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordLink'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters:
        - $ref: '#/components/parameters/Id'
      operationId: postUsersByidPasswordLink
  /api/admin/overview:
    get:
      tags:
        - Users
      summary: Totals, every club with its admins and activity, and the state of the installation (global admins only)
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Global admin rights required
      description: Global admins only.
      operationId: getAdminOverview
  /api/admin/clubs:
    get:
      tags:
        - Users
      summary: Every club (id, name, logo), for the club filter of the admin lists (global admins only)
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Global admin rights required
      description: Global admins only.
      operationId: getAdminClubs
  /api/admin/players:
    get:
      tags:
        - Users
      summary: Players and guests of the clubs in ?clubs=id1,id2, each with its club (global admins only)
      parameters:
        - in: query
          name: clubs
          required: true
          description: Comma-separated club ids, at least one
          schema:
            type: string
      responses:
        '200':
          description: OK
        '400':
          description: No or invalid clubs chosen
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Global admin rights required
      description: Global admins only.
      operationId: getAdminPlayers
  /api/admin/players/{id}/clubs:
    post:
      tags:
        - Administration
      summary: Add a player to a club
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - club
              properties:
                club:
                  type: string
                  description: MongoDB ObjectId
      responses:
        '200':
          description: The player
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
        - $ref: '#/components/parameters/Id'
      description: Global admins only.
      operationId: postAdminPlayersByidClubs
  /api/admin/players/{id}/clubs/{clubId}:
    delete:
      tags:
        - Administration
      summary: Remove a player from a club
      description: Not from their only club; delete the player instead. Global admins only.
      responses:
        '200':
          description: The player
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: clubId
          in: path
          required: true
          schema:
            type: string
      operationId: deleteAdminPlayersByidClubsByclubId
  /api/admin/players/{id}:
    delete:
      tags:
        - Administration
      summary: Delete a player from all clubs
      responses:
        '200':
          description: Player deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Done.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters:
        - $ref: '#/components/parameters/Id'
      description: Global admins only.
      operationId: deleteAdminPlayersByid
  /api/admin/games:
    get:
      tags:
        - Users
      summary: X01, Cricket and Elimination games of the clubs in ?clubs=id1,id2, each with its type and club (global admins only)
      parameters:
        - in: query
          name: clubs
          required: true
          description: Comma-separated club ids, at least one
          schema:
            type: string
      responses:
        '200':
          description: OK
        '400':
          description: No or invalid clubs chosen
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Global admin rights required
      description: Global admins only.
      operationId: getAdminGames
  /api/admin/trainings:
    get:
      tags:
        - Users
      summary: Around the Clock trainings of the clubs in ?clubs=id1,id2, each with its club (global admins only)
      parameters:
        - in: query
          name: clubs
          required: true
          description: Comma-separated club ids, at least one
          schema:
            type: string
      responses:
        '200':
          description: OK
        '400':
          description: No or invalid clubs chosen
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Global admin rights required
      description: Global admins only.
      operationId: getAdminTrainings
  /api/admin/x01-trainings:
    get:
      tags:
        - Administration
      summary: X01 trainings against the bot of the chosen clubs
      parameters:
        - name: clubs
          in: query
          required: false
          description: Comma-separated club ids to include
          schema:
            type: string
      responses:
        '200':
          description: The trainings, each with its club and player
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/X01Training'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: Global admins only.
      operationId: getAdminX01Trainings
  /api/admin/banner:
    get:
      tags:
        - Users
      summary: The banner as global admins edit it, also while switched off
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: Global admins only.
      operationId: getAdminBanner
    put:
      tags:
        - Users
      summary: Switch the banner on or off and set its text (up to 200 characters) and colour (#rrggbb)
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Invalid text or colour
      description: Global admins only.
      operationId: putAdminBanner
  /api/admin/session:
    get:
      tags:
        - Administration
      summary: How long a login lasts
      responses:
        '200':
          description: The setting and its limits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: Global admins only.
      operationId: getAdminSession
    put:
      tags:
        - Administration
      summary: Set how long a login lasts
      description: From 1 to 24 hours; longer logins are cut to it. Global admins only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - timeoutHours
              properties:
                timeoutHours:
                  type: integer
                  minimum: 1
                  maximum: 24
      responses:
        '200':
          description: The setting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      operationId: putAdminSession
  /api/admin/logs:
    get:
      tags:
        - Administration
      summary: The error log
      parameters:
        - name: level
          in: query
          required: false
          description: Only this level
          schema:
            type: string
            enum:
              - error
              - warn
        - name: search
          in: query
          required: false
          description: Text to look for
          schema:
            type: string
      responses:
        '200':
          description: The newest entries and the counts of today
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogEntries'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: Global admins only.
      operationId: getAdminLogs
    delete:
      tags:
        - Administration
      summary: Clear the error log
      responses:
        '200':
          description: How many entries were deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: Global admins only.
      operationId: deleteAdminLogs
  /api/admin/alerts:
    get:
      tags:
        - Administration
      summary: Alerts of unusual activity
      description: E.g. many accounts, clubs or games created at once from one address. Global admins only.
      parameters:
        - name: status
          in: query
          required: false
          description: Which alerts
          schema:
            type: string
            enum:
              - open
              - resolved
              - all
            default: open
      responses:
        '200':
          description: The alerts
          content:
            application/json:
              schema:
                type: array
                items:
