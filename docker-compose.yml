services:

  # ---------------------------------------------------------------------------
  # API Server
  # ---------------------------------------------------------------------------
  darts_score_api:
    container_name: darts_score_server
    build:
      context: .
      target: development   # change to "production" for prod deployment
    ports:
      - "3001:3001"
    volumes:
      # Development hot-reload mounts (remove for production target)
      - ./data:/app/data
      - ./app-api/index.js:/app/index.js
      - ./app-api/src:/app/src
    env_file:
      - ./.env
    environment:
      NODE_ENV: development
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # MongoDB
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:8.0
    container_name: darts_score_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    env_file:
      - ./mongo.env
    environment:
      # mongod < 8.0.35 refuses to start on Ubuntu 7.0.0-x kernels (SERVER-131779).
      # Letting glibc own rseq makes TCMalloc skip per-CPU caches, which passes the check.
      # Remove once mongo:8.0 resolves to >= 8.0.35.
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    volumes:
      - darts_score_db:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  darts_score_db:
    name: darts_score_db
