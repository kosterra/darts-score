name: develop
permissions:
  contents: read

# Every push to develop: the checks, then an image tagged "develop" for a test
# server that runs the newest state (What's new shows its version as coming soon)
on:
  push:
    branches:
      - develop

concurrency:
  group: develop
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  image:
    runs-on: ubuntu-24.04
    needs: checks
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get package info
        id: package
        run: echo "name=$(jq -r .name package.json)" >> "$GITHUB_OUTPUT"

      - name: Login to Dockerhub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: ${{ secrets.DOCKERHUB_USER }}/${{ steps.package.outputs.name }}:develop
          # a cache of its own, so the releases keep theirs
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USER }}/${{ steps.package.outputs.name }}:buildcache-develop
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USER }}/${{ steps.package.outputs.name }}:buildcache-develop,mode=max
